<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Đăng nhập · BGate</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/admin.css') }}">
</head>
<body class="login-page">
  <section class="login-card">
    <div class="brand brand-dark"><span class="brand-mark">B</span><span>BGate</span></div>
    <p class="eyebrow">Billing Router</p>
    <h1>Chào mừng trở lại</h1>
    <p class="muted">Đăng nhập để theo dõi thanh toán và quyền truy cập.</p>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/login" class="login-form">
      <label>Tên đăng nhập<input name="username" autocomplete="username" required autofocus></label>
      <label>Mật khẩu<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Đăng nhập</button>
    </form>
  </section>
</body>
</html>
