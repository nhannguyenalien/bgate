services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    restart: "no"

  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

